[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clearcrest"
version = "0.1.0"
description = "Experimental ClearCrest protocol reference"
requires-python = ">=3.11"

[project.scripts]
clearcrest = "clearcrest.cli.main:main"

[tool.setuptools.packages.find]
include = ["clearcrest*"]
